<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pixora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="pixora-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>
    <filter id="pixora-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#2dd4bf" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Dark Canvas Squircle -->
  <rect width="128" height="128" rx="28" fill="#08090d"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Luminous Ambient Backlight Glow -->
  <circle cx="64" cy="64" r="52" fill="url(#pixora-glow)"/>

  <!-- Generative ASCII Asterisk / Matrix Glyph -->
  <g filter="url(#pixora-bloom)">
    <!-- Primary Orthogonal Beams -->
    <rect x="60" y="26" width="8" height="76" rx="4" fill="url(#pixora-grad)"/>
    <rect x="26" y="60" width="76" height="8" rx="4" fill="url(#pixora-grad)"/>

    <!-- Diagonal Dynamic Beams -->
    <rect x="60" y="26" width="8" height="76" rx="4" transform="rotate(45 64 64)" fill="url(#pixora-grad)" opacity="0.92"/>
    <rect x="60" y="26" width="8" height="76" rx="4" transform="rotate(-45 64 64)" fill="url(#pixora-grad)" opacity="0.92"/>

    <!-- Central Core Jewel -->
    <circle cx="64" cy="64" r="9" fill="#ffffff"/>
    <circle cx="64" cy="64" r="5.5" fill="#2dd4bf"/>

    <!-- Constellation Matrix Points -->
    <circle cx="64" cy="18" r="3.5" fill="#38bdf8"/>
    <circle cx="64" cy="110" r="3.5" fill="#a855f7"/>
    <circle cx="18" cy="64" r="3.5" fill="#38bdf8"/>
    <circle cx="110" cy="64" r="3.5" fill="#a855f7"/>

    <circle cx="31" cy="31" r="2.8" fill="#38bdf8" opacity="0.85"/>
    <circle cx="97" cy="31" r="2.8" fill="#2dd4bf" opacity="0.85"/>
    <circle cx="31" cy="97" r="2.8" fill="#2dd4bf" opacity="0.85"/>
    <circle cx="97" cy="97" r="2.8" fill="#a855f7" opacity="0.85"/>
  </g>
</svg>
